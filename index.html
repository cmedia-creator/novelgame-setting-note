<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ノベルゲーム設定資料ノート</title>
<meta name="description" content="ノベルゲームの企画書・キャラクター設定・プロット・分岐を整理して、設定資料として出力するWebツール。ゲーム本体を制作する機能はありません。">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-head">
  <div class="brand">
    <h1>ノベルゲーム設定資料ノート</h1>
    <p class="sub">企画書・キャラクター・プロット・分岐を整理して、設定資料にまとめるツールです（ゲーム本体は作れません）。</p>
  </div>
  <div class="head-meta"><span id="saveState" class="save-state">—</span></div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="proposal">企画書</button>
  <button role="tab" data-tab="characters">キャラクター</button>
  <button role="tab" data-tab="scenes">プロット</button>
  <button role="tab" data-tab="branches">分岐</button>
  <button role="tab" data-tab="output">資料出力</button>
  <button role="tab" data-tab="data">保存・復元</button>
</nav>

<main id="main">
  <section id="tab-proposal" class="tab-panel"></section>
  <section id="tab-characters" class="tab-panel"></section>
  <section id="tab-scenes" class="tab-panel"></section>
  <section id="tab-branches" class="tab-panel"></section>
  <section id="tab-output" class="tab-panel"></section>
  <section id="tab-data" class="tab-panel"></section>
</main>

<footer class="app-foot">© 2026 久賀ラトル　入力内容はこのブラウザの中だけに保存され、外部には送信されません。</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<datalist id="routeList"></datalist>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
